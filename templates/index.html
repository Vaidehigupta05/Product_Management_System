<!DOCTYPE html>
<html>
<head>
    <title>Inventory Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <h1>Inventory Management System</h1>

    <h2>Add Product</h2>

    <form id="productForm">

        <input
            type="text"
            id="name"
            placeholder="Product Name"
            required
        >

        <input
            type="text"
            id="category"
            placeholder="Category"
            required
        >

        <input
            type="number"
            id="quantity"
            placeholder="Quantity"
            min="0"
            required
        >

        <input
            type="number"
            id="price"
            placeholder="Price"
            min="0"
            step="0.01"
            required
        >

        <button type="submit">Add Product</button>

    </form>

    <p id="message"></p>
    <div id="editSection" style="display: none;">

    <h2>Edit Product</h2>

    <input
        type="text"
        id="editName"
        placeholder="Product Name"
    >

    <input
        type="text"
        id="editCategory"
        placeholder="Category"
    >

    <input
        type="number"
        id="editQuantity"
        placeholder="Quantity"
        min="0"
    >

    <input
        type="number"
        id="editPrice"
        placeholder="Price"
        min="0"
        step="0.01"
    >

    <button type="button" onclick="saveEdit()">
        Save Changes
    </button>

    <button type="button" onclick="cancelEdit()">
        Cancel
    </button>

</div>
    <div>
    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, category or ID"
    >

    <button type="button" onclick="searchProducts()">
        Search
    </button>

    <button type="button" onclick="loadProducts()">
        Show All
    </button>
</div>
<h2>Low Stock Alert</h2>

<div id="lowStockAlert">
    No low-stock products.
</div>
    <h2>Products</h2>

<table border="1">
    <thead>
        <tr>
            <th>Product ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Quantity</th>
            <th>Price</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody id="productTable">
    </tbody>
</table>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
